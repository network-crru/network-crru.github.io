<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบฟอร์มออนไลน์</title></head>
<body><div id="root" class="np">กำลังโหลด...</div>
<script src="paper.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxwkXt331Q4vmwD2fMM9P3eeXXig2FXq2Ll0ujE5ZiT6WZnFHuHpZ4hhIK4Zx8EhYNXPg/exec'; // วาง URL Web App ที่นี่
const root = document.getElementById('root'), id = new URLSearchParams(location.search).get('form');
(async () => {
  try {
    if (!id) {
      const r = await (await fetch(API)).json();
      return root.innerHTML = '<h2>เลือกแบบฟอร์ม</h2>' + r.forms.map(f => `<p><a href="?form=${f.id}">${esc(f.name)}</a></p>`).join('');
    }
    const r = await (await fetch(API + '?action=form&id=' + id)).json();
    if (!r.ok) return root.innerHTML = esc(r.error);
    const form = r.form; document.title = form.name; root.className = '';
    root.innerHTML = `<form id="f">${renderPaper(form, { mode: 'edit' })}<div class="np"><button style="width:100%;padding:14px;font:inherit;font-size:1.1rem;background:#2f5bea;color:#fff;border:0;border-radius:8px">ส่งแบบฟอร์ม</button></div></form>`;
    document.getElementById('f').onsubmit = async e => {
      e.preventDefault();
      const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'กำลังส่ง...';
      const data = {};
      for (const [k, v] of new FormData(e.target).entries()) data[k] = v instanceof File ? await sigData(v) : v;
      try {
        const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'submit', formId: form.id, data }) })).json();
        if (!r.ok) throw r.error;
        root.className = 'np'; root.innerHTML = `<h2>ส่งแบบฟอร์มเรียบร้อย ✅</h2>รหัสอ้างอิง <b>${r.id}</b> ผลพิจารณาจะแจ้งทางอีเมลที่ระบุ`;
      } catch (err) { alert('ส่งไม่สำเร็จ: ' + err); btn.disabled = false; btn.textContent = 'ส่งแบบฟอร์ม'; }
    };
  } catch (e) { root.textContent = 'โหลดไม่สำเร็จ ตรวจสอบ API URL'; }
})();
</script></body></html>
