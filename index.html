<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบฟอร์มออนไลน์</title>
<style>
body{font-family:'Sarabun',system-ui,sans-serif;background:#f3f4f8;margin:0;padding:16px;color:#222}
.card{max-width:720px;margin:auto;background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px #0001}
h1{font-size:1.3rem;text-align:center;margin-top:0}
label{display:block;margin:14px 0 4px;font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=date],textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:6px;font:inherit}
.opt{display:inline-block;margin-right:16px;font-weight:400}
.opt input{margin-right:4px}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:#2f5bea;color:#fff;font:inherit;font-size:1.05rem;cursor:pointer}
button:disabled{opacity:.6}
.req{color:#d33}
a.f{display:block;padding:12px;margin:8px 0;background:#eef2ff;border-radius:8px;text-decoration:none;color:#2f5bea}
.msg{text-align:center;padding:20px}
</style>
</head>
<body>
<div class="card" id="root">กำลังโหลด...</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbxwkXt331Q4vmwD2fMM9P3eeXXig2FXq2Ll0ujE5ZiT6WZnFHuHpZ4hhIK4Zx8EhYNXPg/exec'; // วาง URL ของ Apps Script Web App ที่นี่
const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = new URLSearchParams(location.search).get('form');
let form;

(async () => {
  try {
    if (!id) {
      const r = await (await fetch(API)).json();
      root.innerHTML = '<h1>เลือกแบบฟอร์ม</h1>' + r.forms.map(f => `<a class="f" href="?form=${f.id}">${esc(f.name)}</a>`).join('');
      return;
    }
    const r = await (await fetch(API + '?action=form&id=' + id)).json();
    if (!r.ok) return root.innerHTML = `<div class="msg">${esc(r.error)}</div>`;
    form = r.form;
    document.title = form.name;
    root.innerHTML = `<h1>${esc(form.name)}</h1><form id="f">` + form.fields.map(fieldHtml).join('') +
      `<label>อีเมลสำหรับรับการแจ้งเตือนผล <span class="req">*</span></label><input type="email" name="__email" required>
       <button id="b">ส่งแบบฟอร์ม</button></form>`;
    document.getElementById('f').onsubmit = submit;
  } catch (e) { root.innerHTML = '<div class="msg">โหลดไม่สำเร็จ ตรวจสอบ API URL</div>'; }
})();

function fieldHtml(f, i) {
  const n = 'f' + i, rq = f.req ? 'required' : '', st = f.req ? ' <span class="req">*</span>' : '';
  const opts = (f.opts || '').split(',').map(s => s.trim()).filter(Boolean);
  let inp;
  if (f.type == 'textarea') inp = `<textarea name="${n}" rows="3" ${rq}></textarea>`;
  else if (f.type == 'select') inp = `<select name="${n}" ${rq}><option value="">-- เลือก --</option>${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type == 'radio') inp = opts.map((o, k) => `<label class="opt"><input type="radio" name="${n}" value="${esc(o)}" ${k == 0 ? rq : ''}>${esc(o)}</label>`).join('');
  else if (f.type == 'check') return `<label class="opt" style="margin-top:14px"><input type="checkbox" name="${n}" ${rq}>${esc(f.label)}${st}</label>`;
  else inp = `<input type="${f.type}" name="${n}" ${rq}>`;
  return `<label>${esc(f.label)}${st}</label>${inp}`;
}

async function submit(e) {
  e.preventDefault();
  const fd = new FormData(e.target), data = {};
  form.fields.forEach((f, i) => { const v = fd.get('f' + i); data[f.label] = f.type == 'check' ? (v ? 'ยอมรับ' : '') : (v || ''); });
  const b = document.getElementById('b'); b.disabled = true; b.textContent = 'กำลังส่ง...';
  try {
    const r = await (await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'submit', formId: form.id, email: fd.get('__email'), data }) })).json();
    root.innerHTML = r.ok ? `<div class="msg"><h2>ส่งแบบฟอร์มเรียบร้อย ✅</h2>รหัสอ้างอิง: <b>${r.id}</b><br>ผลการพิจารณาจะแจ้งทางอีเมลที่ระบุ</div>` : `<div class="msg">${esc(r.error)}</div>`;
  } catch (err) { alert('ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'); b.disabled = false; b.textContent = 'ส่งแบบฟอร์ม'; }
}
</script>
</body>
</html>
