<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หลังบ้าน</title>
<style>
.box{background:#fff;border-radius:10px;padding:14px;margin:10px auto;max-width:1000px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}
button{padding:7px 13px;border:0;border-radius:6px;background:#2f5bea;color:#fff;font:inherit;cursor:pointer;margin:2px}
.gy{background:#777}.rd{background:#d33}.ok{background:#1a9b4b}
.st{display:inline-block;background:#eef2ff;border-radius:8px;padding:8px 12px;margin:4px}
.tag{padding:2px 8px;border-radius:10px;color:#fff;font-size:.8rem}.pending{background:#e69a00}.approved{background:#1a9b4b}.rejected{background:#d33}
textarea,input,select{font:inherit;box-sizing:border-box}textarea{width:100%}
</style></head><body>
<div class="box np" id="login"><input type="password" id="pw" placeholder="รหัสผ่านผู้ดูแล"> <button onclick="pw=$('#pw').value;sessionStorage.pw=pw;load()">เข้าสู่ระบบ</button></div>

<div id="main" hidden>
 <div class="np box"><button onclick="tab(1)">Dashboard</button><button class="gy" onclick="tab(2)">จัดการแบบฟอร์ม</button><button class="gy" onclick="sessionStorage.pw='';location.reload()">ออก</button></div>
 <div id="p1"><div class="box np" id="stats"></div>
  <div class="box np"><select id="flt" onchange="rt()"></select><table><thead><tr><th>วันที่</th><th>แบบฟอร์ม</th><th>อีเมล</th><th>สถานะ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
 <div id="p2" hidden>
  <div class="box np"><button onclick="edit()">+ เพิ่มแบบฟอร์ม</button><table id="fl"></table></div>
  <div class="box np" id="ed" hidden>
   <input id="fn" placeholder="ชื่อแบบฟอร์ม" style="width:70%"> <label><input type="checkbox" id="fa" checked> เปิดรับ</label>
   <p><b>ผู้อนุมัติ</b> 1 บรรทัดต่อ 1 คน: <code>หัวข้อกล่อง|(ชื่อ)|ตำแหน่ง</code></p><textarea id="fp" rows="3"></textarea>
   <p><b>เทมเพลต HTML</b> ช่องกรอก: <code>{{key|text}}</code> <code>{{key|date|30}}</code> (เลขท้าย=ความกว้าง %) ชนิด text,date,tel,email,area,<code>{{key|radio|ก,ข}}</code> ลายเซ็น <code>{{key|sig|ป้ายชื่อ}}</code> กล่องอนุมัติ <code>{{1|appr}}</code> ต้องมีช่อง key ชื่อ <b>email</b></p>
   <textarea id="ft" rows="14"></textarea><button class="ok" onclick="save()">บันทึก</button><button class="gy" onclick="$('#ed').hidden=true">ปิด</button></div>
 </div>
</div>
<div id="vw" hidden></div>
<script src="paper.js"></script>
<script>
const API = 'YOUR_WEB_APP_URL'; // วาง URL Web App ที่นี่
const $ = s => document.querySelector(s), TH = { pending: 'รออนุมัติ', approved: 'อนุมัติ', rejected: 'ยกเลิก' };
let pw = sessionStorage.pw || '', D = {}, cur, editId;
const call = async o => (await fetch(API, { method: 'POST', body: JSON.stringify({ ...o, pw }) })).json();

async function load() {
  if (!pw) return;
  const r = await call({ action: 'data' });
  if (!r.ok) { alert(r.error); sessionStorage.pw = pw = ''; return; }
  D = r; D.forms.forEach(f => f.ap = JSON.parse(f.approvers || '[]'));
  D.subs.forEach(s => { s.ap = JSON.parse(s.approvals || '[]'); s.d = JSON.parse(s.data || '{}'); });
  $('#login').hidden = true; $('#main').hidden = false;
  $('#flt').innerHTML = '<option value="">ทุกแบบฟอร์ม</option>' + D.forms.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
  $('#stats').innerHTML = D.forms.map(f => { const s = D.subs.filter(x => x.formId == f.id), c = k => s.filter(x => x.status == k).length;
    return `<div class="st"><b>${esc(f.name)}</b><br>ส่งมา ${s.length} | รอ ${c('pending')} | อนุมัติ ${c('approved')} | ยกเลิก ${c('rejected')}</div>`; }).join('');
  $('#fl').innerHTML = D.forms.map(f => `<tr><td>${esc(f.name)}${f.active ? '' : ' (ปิด)'}</td><td>
   <button onclick="navigator.clipboard.writeText(location.href.replace(/admin\\.html.*$/,'')+'index.html?form=${f.id}').then(()=>alert('คัดลอกลิงก์แล้ว'))">คัดลอกลิงก์</button>
   <button class="gy" onclick="edit('${f.id}')">แก้ไข</button><button class="rd" onclick="del('${f.id}')">ลบ</button></td></tr>`).join('');
  rt();
}
function rt() {
  const f = $('#flt').value;
  $('#tb').innerHTML = D.subs.filter(s => !f || s.formId == f).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(s =>
    `<tr><td>${new Date(s.createdAt).toLocaleString('th-TH')}</td><td>${esc(s.formName)}</td><td>${esc(s.email)}</td>
    <td><span class="tag ${s.status}">${TH[s.status]}</span> ${s.ap.filter(a => a.status == 'approved').length}/${s.ap.length}</td><td><button onclick="view('${s.id}')">เปิดแบบฟอร์ม</button></td></tr>`).join('');
}
function tab(n) { $('#p1').hidden = n != 1; $('#p2').hidden = n != 2; }
function back() { $('#vw').hidden = true; $('#main').hidden = false; }

function view(id) {
  const s = D.subs.find(x => x.id == id), f = D.forms.find(x => x.id == s.formId);
  if (!f) return alert('แบบฟอร์มต้นฉบับถูกลบแล้ว');
  cur = s; $('#main').hidden = true; $('#vw').hidden = false;
  $('#vw').innerHTML = `<div class="np box"><button class="gy" onclick="back()">← กลับ</button><button onclick="print()">🖨 พิมพ์ / บันทึก PDF</button></div>` +
   renderPaper({ template: f.template, approvers: f.ap }, { mode: 'view', data: s.d, approvals: s.ap }) +
   `<div class="np box"><b>พิจารณาคำขอ</b><br><select id="ix">${f.ap.map((a, i) => `<option value="${i}">${esc(a.title)}</option>`).join('')}</select>
   <label><input type="radio" name="st" value="approved" checked> อนุมัติ</label> <label><input type="radio" name="st" value="rejected"> ไม่อนุมัติ</label>
   <textarea id="rs" rows="2" placeholder="เหตุผล/หมายเหตุ (ส่งไปในอีเมลผู้ขอ)"></textarea>
   ลายเซ็นผู้อนุมัติ: <input type="file" id="sf" accept="image/*"> <small>ไม่เลือก = ใช้ลายเซ็นที่เคยอัปโหลดในเครื่องนี้</small><br>
   <button class="ok" onclick="decide()">บันทึกผล</button></div>`;
}
async function decide() {
  const idx = +$('#ix').value, st = document.querySelector('[name=st]:checked').value, reason = $('#rs').value, fl = $('#sf').files[0];
  const sig = fl ? await sigData(fl) : localStorage['sig' + idx];
  if (st == 'approved' && !sig) return alert('กรุณาอัปโหลดลายเซ็น');
  if (st == 'rejected' && !reason.trim()) return alert('กรุณาใส่เหตุผล');
  if (sig) localStorage['sig' + idx] = sig;
  if (!confirm('ยืนยันบันทึกผล?')) return;
  const r = await call({ action: 'decide', id: cur.id, idx, status: st, reason, sig });
  if (!r.ok) return alert(r.error);
  await load(); view(cur.id);
}

function edit(id) {
  editId = id; const f = D.forms.find(x => x.id == id) || D.forms[0] || { ap: [] }; // ฟอร์มใหม่ใช้ฟอร์มแรกเป็นต้นแบบ
  $('#fn').value = id ? f.name : ''; $('#fa').checked = id ? !!f.active : true;
  $('#fp').value = f.ap.map(a => [a.title, a.name, a.pos].join('|')).join('\n'); $('#ft').value = f.template || '';
  $('#ed').hidden = false;
}
async function save() {
  const ap = $('#fp').value.split('\n').filter(l => l.trim()).map(l => { const [title, name, pos] = l.split('|'); return { title, name: name || '', pos: pos || '' }; });
  if (!$('#fn').value.trim() || !$('#ft').value.includes('{{email|')) return alert('ต้องมีชื่อฟอร์ม และช่อง {{email|email}} ในเทมเพลต');
  const r = await call({ action: 'saveForm', form: { id: editId, name: $('#fn').value, active: $('#fa').checked, template: $('#ft').value, approvers: JSON.stringify(ap) } });
  if (!r.ok) return alert(r.error); $('#ed').hidden = true; load();
}
async function del(id) { if (confirm('ลบแบบฟอร์มนี้?')) { await call({ action: 'deleteForm', id }); load(); } }
load();
</script></body></html>
