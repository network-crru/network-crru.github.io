<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>หลังบ้าน - จัดการแบบฟอร์ม</title>
<style>
body{font-family:'Sarabun',system-ui,sans-serif;background:#f3f4f8;margin:0;padding:16px;color:#222}
.wrap{max-width:1000px;margin:auto}
.box{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #0001}
input,textarea,select{padding:8px;border:1px solid #bbb;border-radius:6px;font:inherit;box-sizing:border-box}
textarea{width:100%}
button{padding:7px 14px;border:0;border-radius:6px;background:#2f5bea;color:#fff;font:inherit;cursor:pointer;margin:2px}
button.g{background:#777}button.r{background:#d33}button.ok{background:#1a9b4b}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.stats{display:flex;flex-wrap:wrap;gap:12px}
.st{flex:1;min-width:220px;background:#eef2ff;border-radius:10px;padding:12px}
.tag{padding:2px 8px;border-radius:10px;font-size:.8rem;color:#fff}
.pending{background:#e69a00}.approved{background:#1a9b4b}.rejected{background:#d33}
nav button{background:#ddd;color:#222}nav button.on{background:#2f5bea;color:#fff}
dialog{max-width:560px;width:92%;border:0;border-radius:12px}
.tw{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="box" id="login"><h3>เข้าสู่ระบบผู้ดูแล</h3><input type="password" id="pw" placeholder="รหัสผ่าน"> <button onclick="login()">เข้าสู่ระบบ</button></div>
<div id="app" hidden>
<nav><button id="t1" class="on" onclick="tab(1)">Dashboard</button><button id="t2" onclick="tab(2)">จัดการแบบฟอร์ม</button><button class="g" onclick="sessionStorage.pw='';location.reload()">ออกจากระบบ</button></nav>

<div id="p1">
 <div class="box"><div class="stats" id="stats"></div></div>
 <div class="box"><select id="flt" onchange="renderTable()"></select>
  <div class="tw"><table><thead><tr><th>วันที่</th><th>แบบฟอร์ม</th><th>อีเมล</th><th>สถานะ</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
</div>

<div id="p2" hidden>
 <div class="box"><button onclick="edit()">+ เพิ่มแบบฟอร์มใหม่</button><div class="tw"><table><tbody id="fl"></tbody></table></div></div>
 <div class="box" id="ed" hidden>
  <h3>แก้ไขแบบฟอร์ม</h3>
  <input id="fn" placeholder="ชื่อแบบฟอร์ม" style="width:100%"><br><br>
  <label><input type="checkbox" id="fa" checked> เปิดรับคำขอ</label><br><br>
  <small>1 บรรทัด = 1 ช่อง รูปแบบ <code>ชื่อช่อง|ชนิด|*|ตัวเลือก,คั่นด้วยจุลภาค</code><br>
  ชนิด: text, textarea, date, email, tel, radio, select, check &nbsp;/ ใส่ * = บังคับกรอก</small>
  <textarea id="ff" rows="12"></textarea>
  <button class="ok" onclick="save()">บันทึก</button><button class="g" onclick="$('#ed').hidden=true">ยกเลิก</button>
 </div>
</div>
</div>
</div>

<dialog id="dlg"><div id="dc"></div></dialog>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxwkXt331Q4vmwD2fMM9P3eeXXig2FXq2Ll0ujE5ZiT6WZnFHuHpZ4hhIK4Zx8EhYNXPg/exec'; // วาง URL ของ Apps Script Web App ที่นี่
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH = { pending: 'รออนุมัติ', approved: 'อนุมัติ', rejected: 'ยกเลิก' };
let pw = sessionStorage.pw || '', D = { forms: [], subs: [] }, editId = null;
const call = async o => (await fetch(API, { method: 'POST', body: JSON.stringify({ ...o, pw }) })).json();

function login() { pw = $('#pw').value; sessionStorage.pw = pw; load(); }
async function load() {
  if (!pw) return;
  const r = await call({ action: 'data' });
  if (!r.ok) { alert(r.error); sessionStorage.pw = ''; pw = ''; return; }
  D = r; $('#login').hidden = true; $('#app').hidden = false;
  $('#flt').innerHTML = '<option value="">ทุกแบบฟอร์ม</option>' + D.forms.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
  renderStats(); renderTable(); renderForms();
}
function tab(n) { [1, 2].forEach(i => { $('#p' + i).hidden = i != n; $('#t' + i).className = i == n ? 'on' : ''; }); }

function renderStats() {
  $('#stats').innerHTML = D.forms.map(f => {
    const s = D.subs.filter(x => x.formId == f.id), c = k => s.filter(x => x.status == k).length;
    return `<div class="st"><b>${esc(f.name)}</b><br>ส่งมา ${s.length} | รอ ${c('pending')} | อนุมัติ ${c('approved')} | ยกเลิก ${c('rejected')}</div>`;
  }).join('') || 'ยังไม่มีแบบฟอร์ม';
}
function renderTable() {
  const f = $('#flt').value;
  $('#tb').innerHTML = D.subs.filter(s => !f || s.formId == f).sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map(s =>
    `<tr><td>${new Date(s.createdAt).toLocaleString('th-TH')}</td><td>${esc(s.formName)}</td><td>${esc(s.email)}</td>
     <td><span class="tag ${s.status}">${TH[s.status]}</span></td><td><button onclick="view('${s.id}')">ดู/พิจารณา</button></td></tr>`).join('');
}
function view(id) {
  const s = D.subs.find(x => x.id == id), d = JSON.parse(s.data || '{}');
  $('#dc').innerHTML = `<h3>${esc(s.formName)}</h3><p>รหัส ${s.id} | ${esc(s.email)} | <span class="tag ${s.status}">${TH[s.status]}</span></p>
   <table>${Object.entries(d).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</table>
   ${s.reason ? `<p>เหตุผลเดิม: ${esc(s.reason)}</p>` : ''}
   <textarea id="rs" rows="3" placeholder="เหตุผล/หมายเหตุ (จะส่งไปในอีเมล)"></textarea>
   <button class="ok" onclick="decide('${id}','approved')">อนุมัติ</button><button class="r" onclick="decide('${id}','rejected')">ยกเลิก</button><button class="g" onclick="$('#dlg').close()">ปิด</button>`;
  $('#dlg').showModal();
}
async function decide(id, status) {
  const reason = $('#rs').value;
  if (status == 'rejected' && !reason.trim()) return alert('กรุณาใส่เหตุผลการยกเลิก');
  if (!confirm('ยืนยัน และส่งอีเมลแจ้งผู้ขอ?')) return;
  const r = await call({ action: 'decide', id, status, reason });
  if (!r.ok) return alert(r.error);
  $('#dlg').close(); load();
}

const link = id => location.href.replace(/admin\.html.*$/, '') + 'index.html?form=' + id;
function renderForms() {
  $('#fl').innerHTML = D.forms.map(f => `<tr><td>${esc(f.name)} ${f.active ? '' : '<small>(ปิด)</small>'}</td><td>
   <button onclick="navigator.clipboard.writeText('${link(f.id)}').then(()=>alert('คัดลอกลิงก์แล้ว'))">คัดลอกลิงก์</button>
   <button class="g" onclick="edit('${f.id}')">แก้ไข</button><button class="r" onclick="del('${f.id}')">ลบ</button></td></tr>`).join('');
}
function edit(id) {
  editId = id || null;
  const f = D.forms.find(x => x.id == id);
  $('#fn').value = f ? f.name : '';
  $('#fa').checked = f ? !!f.active : true;
  $('#ff').value = f ? JSON.parse(f.fields).map(x => [x.label, x.type, x.req ? '*' : '', x.opts || ''].join('|')).join('\n') : 'ชื่อ-นามสกุล|text|*\nรายละเอียด|textarea|';
  $('#ed').hidden = false;
}
async function save() {
  const fields = $('#ff').value.split('\n').filter(l => l.trim()).map(l => {
    const [label, type, req, opts] = l.split('|').map(s => s.trim());
    return { label, type: type || 'text', req: req == '*', opts: opts || '' };
  });
  if (!$('#fn').value.trim() || !fields.length) return alert('กรอกชื่อและช่องอย่างน้อย 1 ช่อง');
  const r = await call({ action: 'saveForm', form: { id: editId, name: $('#fn').value, active: $('#fa').checked, fields: JSON.stringify(fields) } });
  if (!r.ok) return alert(r.error);
  $('#ed').hidden = true; load();
}
async function del(id) { if (confirm('ลบแบบฟอร์มนี้? (คำขอที่ส่งมาแล้วยังอยู่)')) { await call({ action: 'deleteForm', id }); load(); } }

load();
</script>
</body>
</html>
